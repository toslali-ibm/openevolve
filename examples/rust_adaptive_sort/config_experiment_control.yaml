# Rust Adaptive Sort — CONTROL (vanilla OpenEvolve)
# Identical to treatment except hypothesis_driven: false

hypothesis_driven: false

max_iterations: 30
checkpoint_interval: 5
log_level: "INFO"
file_suffix: ".rs"

llm:
  primary_model: "Azure/gpt-5.2-2025-12-11"
  primary_model_weight: 0.7
  secondary_model: "aws/claude-opus-4-6"
  secondary_model_weight: 0.3
  api_base: "https://ete-litellm.ai-models.vpc-int.res.ibm.com"
  temperature: 0.7
  top_p: null
  max_tokens: 16384
  timeout: 120

  system_message: |
    You are an expert Rust systems programmer specializing in high-performance algorithms.
    Focus on creating adaptive sorting algorithms that can handle different data patterns efficiently.
    Consider hybrid approaches like introsort, adaptive pivot selection, and data-aware optimizations.
    Ensure memory safety and idiomatic Rust code. Use appropriate data structures and leverage Rust's zero-cost abstractions.

prompt:
  num_top_programs: 4
  num_diverse_programs: 3
  include_artifacts: true
  max_artifact_bytes: 8192

database:
  population_size: 150
  num_islands: 4
  feature_dimensions:
    - "combined_score"
    - "performance_score"
    - "adaptability_score"
  feature_bins: 8

evaluator:
  timeout: 60
  parallel_evaluations: 1
  cascade_evaluation: false
