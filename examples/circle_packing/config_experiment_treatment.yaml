# Circle Packing - TREATMENT (hypothesis-driven)
# A/B Experiment: Treatment condition with hypothesis_driven=true

max_iterations: 20
checkpoint_interval: 5

# Hypothesis-driven evolution (treatment condition)
hypothesis_driven: true

# LLM configuration
llm:
  primary_model: "GCP/gemini-2.5-flash"
  primary_model_weight: 0.8
  secondary_model: "gcp/gemini-3-flash-preview"
  secondary_model_weight: 0.2
  api_base: "https://ete-litellm.ai-models.vpc-int.res.ibm.com"
  temperature: 0.7
  max_tokens: 16000
  timeout: 120

# Prompt configuration
prompt:
  system_message: |
    You are an expert mathematician specializing in circle packing problems and computational geometry.
    Your task is to improve a constructor function that directly produces a specific arrangement of
    26 circles in a unit square, maximizing the sum of their radii.
    The AlphaEvolve paper achieved a sum of 2.635 for n=26.

    Key geometric insights:
    - Circle packings often follow hexagonal patterns in the densest regions
    - Maximum density for infinite circle packing is pi/(2*sqrt(3)) ~ 0.9069
    - Edge effects make square container packing harder than infinite packing
    - Circles can be placed in layers or shells when confined to a square
    - Similar radius circles often form regular patterns, while varied radii allow better space utilization

    Performance metrics (higher = better):
      - sum_radii: total sum of all circle radii (maximize this)
      - target_ratio: ratio to AlphaEvolve target of 2.635 (1.0 = matches paper)
      - validity: 1.0 if packing is valid (no overlaps, inside square), 0.0 otherwise
      - combined_score: target_ratio * validity

    HYPOTHESIS REQUIREMENTS:
    You MUST include at least 1 hypothesis (max 3) as Python comments at the TOP of the
    EVOLVE-BLOCK, BEFORE any code. This is MANDATORY — code without hypotheses will be penalized.

    Format (each hypothesis needs all 3 lines):
      # HYPOTHESIS-N: <one-line claim about what will improve and why>
      # MECHANISM-N: <causal explanation - what signal/behavior drives the improvement>
      # EXPECT-N: <metric_name> > <threshold>   (use > because higher scores are better)

    Available metrics for EXPECT:
      - sum_radii, target_ratio, combined_score

    Hypothesis rules:
      - N starts at 1 and increments
      - metric_name must be one of: sum_radii, target_ratio, combined_score
      - Use > operator (these scores are higher-is-better)
      - threshold is a number; the hypothesis is CONFIRMED if actual > threshold
      - Be specific about WHY your change helps
      - If a strategy was REFUTED in the knowledge base, explain why your new approach differs
      - Build on CONFIRMED strategies; combine proven techniques

    EXAMPLE of correct format:
    ```python
    # EVOLVE-BLOCK-START
    # HYPOTHESIS-1: Hexagonal close-packing in center improves sum_radii
    # MECHANISM-1: Hexagonal arrangement maximizes local packing density,
    #   allowing circles of similar size to pack with minimal wasted space
    # EXPECT-1: sum_radii > 1.5
    # HYPOTHESIS-2: Edge-aware placement avoids wasted boundary space
    # MECHANISM-2: Placing smaller circles along edges fills gaps that large
    #   circles cannot occupy, increasing total coverage
    # EXPECT-2: target_ratio > 0.6
    import numpy as np
    def construct_packing():
        # ... improved packing code ...
    ```

    IMPORTANT: Every response MUST start with hypothesis comments before any code.

# Database configuration
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

# Evaluator configuration
evaluator:
  timeout: 120
  cascade_thresholds: [0.3]
  parallel_evaluations: 3

# Evolution settings
diff_based_evolution: true
max_code_length: 30000
