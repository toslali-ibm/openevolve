# Multi-Tenant Chat Platform
# Simulates production chat with many tenants sharing system prompts
# 5 prefix groups, multi-turn conversations with context growth
# Total: 5000 requests

version: "1"
seed: 42
category: reasoning
aggregate_rate: 200.0
num_requests: 5000

clients:
  # Tenant A - Customer Support (shared prompt)
  - id: "tenant-a-support"
    tenant_id: "tenant-a"
    slo_class: "realtime"
    rate_fraction: 0.15
    streaming: true
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 150
        std_dev: 50
        min: 20
        max: 500
    output_distribution:
      type: exponential
      params:
        mean: 100
    prefix_group: "tenant-a-system"
    reasoning:
      multi_turn:
        max_rounds: 4
        think_time_us: 200000
        context_growth: "accumulate"

  # Tenant A - Analytics (same prefix, different pattern)
  - id: "tenant-a-analytics"
    tenant_id: "tenant-a"
    slo_class: "batch"
    rate_fraction: 0.10
    streaming: false
    arrival:
      process: gamma
      cv: 3.0
    input_distribution:
      type: pareto_lognormal
      params:
        alpha: 1.5
        xm: 100
        mu: 6.0
        sigma: 1.0
        mix_weight: 0.3
    output_distribution:
      type: exponential
      params:
        mean: 500
    prefix_group: "tenant-a-system"

  # Tenant B - Coding Assistant (different prefix)
  - id: "tenant-b-coding"
    tenant_id: "tenant-b"
    slo_class: "interactive"
    rate_fraction: 0.20
    streaming: true
    arrival:
      process: gamma
      cv: 2.0
    input_distribution:
      type: gaussian
      params:
        mean: 300
        std_dev: 150
        min: 50
        max: 2000
    output_distribution:
      type: exponential
      params:
        mean: 200
    prefix_group: "tenant-b-coding-system"
    reasoning:
      multi_turn:
        max_rounds: 3
        think_time_us: 500000
        context_growth: "accumulate"

  # Tenant C - Document Processing (large batch)
  - id: "tenant-c-docs"
    tenant_id: "tenant-c"
    slo_class: "batch"
    rate_fraction: 0.25
    streaming: false
    arrival:
      process: gamma
      cv: 4.0
    input_distribution:
      type: pareto_lognormal
      params:
        alpha: 1.2
        xm: 200
        mu: 7.0
        sigma: 1.5
        mix_weight: 0.4
    output_distribution:
      type: exponential
      params:
        mean: 800
    prefix_group: "tenant-c-doc-system"

  # Global shared prompt users (cross-tenant)
  - id: "shared-api-users"
    tenant_id: "shared"
    slo_class: "interactive"
    rate_fraction: 0.30
    streaming: false
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 100
        std_dev: 40
        min: 10
        max: 300
    output_distribution:
      type: exponential
      params:
        mean: 80
    prefix_group: "global-api-prompt"
