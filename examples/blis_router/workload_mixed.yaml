# =============================================================================
# Mixed Workload (Multi-Tenant: Batch + Realtime)
# =============================================================================
# Simulates a realistic multi-tenant production scenario:
# - 4 tenants total: 2 batch pipelines + 2 realtime applications
# - Each tenant has its own system prompt prefix (prefix_group)
# - Tests routing under mixed SLO requirements with prefix affinity opportunities
# - Total: ~12000 requests over 2 minutes
# =============================================================================

version: "1"
seed: 42
category: language
aggregate_rate: 100.0           # 100 req/s total (~25 req/s per instance with 4 instances)
horizon: 120000000              # 2 minutes

clients:
  # =========================================================================
  # BATCH TENANTS (70% of traffic) - Latency tolerant, bursty
  # =========================================================================

  # -------------------------------------------------------------------------
  # Batch Tenant 1: Analytics Pipeline (40% of total traffic)
  # Processing analytics queries with shared analytics prompt
  # -------------------------------------------------------------------------
  - id: "analytics-batch"
    prefix_group: "batch-analytics"     # Shared prefix: analytics context
    slo_class: "batch"
    rate_fraction: 0.40                 # 40 req/s
    streaming: false
    arrival:
      process: gamma
      cv: 3.5                           # Very bursty: batch submissions
    input_distribution:
      type: pareto_lognormal
      params:
        alpha: 1.5
        xm: 50
        mu: 5.5
        sigma: 1.2
        mix_weight: 0.3
    output_distribution:
      type: exponential
      params:
        mean: 300                       # Analytics: longer responses

  # -------------------------------------------------------------------------
  # Batch Tenant 2: Content Generation Pipeline (30% of total traffic)
  # Generating content with shared content generation prompt
  # -------------------------------------------------------------------------
  - id: "content-batch"
    prefix_group: "batch-content"       # Shared prefix: content generation context
    slo_class: "batch"
    rate_fraction: 0.30                 # 30 req/s
    streaming: false
    arrival:
      process: gamma
      cv: 4.0                           # Very bursty
    input_distribution:
      type: gaussian
      params:
        mean: 100                       # Short prompts for content generation
        std_dev: 40
        min: 20
        max: 300
    output_distribution:
      type: pareto_lognormal            # Content: highly variable length
      params:
        alpha: 1.5
        xm: 100
        mu: 5.5
        sigma: 1.0
        mix_weight: 0.3

  # =========================================================================
  # REALTIME TENANTS (30% of traffic) - Latency sensitive, steady
  # =========================================================================

  # -------------------------------------------------------------------------
  # Realtime Tenant 1: Chat Application (20% of total traffic)
  # Live chat with shared chat system prompt
  # -------------------------------------------------------------------------
  - id: "chat-realtime"
    prefix_group: "realtime-chat"       # Shared prefix: chat system prompt
    slo_class: "realtime"
    rate_fraction: 0.20                 # 20 req/s
    streaming: true                     # Streaming for responsive UX
    arrival:
      process: poisson                  # Steady: user-driven
    input_distribution:
      type: gaussian
      params:
        mean: 80                        # Chat: short messages
        std_dev: 30
        min: 10
        max: 256
    output_distribution:
      type: exponential
      params:
        mean: 100                       # Chat: quick responses

  # -------------------------------------------------------------------------
  # Realtime Tenant 2: Search/RAG Application (10% of total traffic)
  # Search queries with shared RAG system prompt
  # -------------------------------------------------------------------------
  - id: "search-realtime"
    prefix_group: "realtime-search"     # Shared prefix: RAG/search context
    slo_class: "realtime"
    rate_fraction: 0.10                 # 10 req/s
    streaming: true                     # Streaming for fast first token
    arrival:
      process: poisson                  # Steady: search queries
    input_distribution:
      type: gaussian
      params:
        mean: 200                       # Search: query + retrieved context
        std_dev: 60
        min: 50
        max: 512
    output_distribution:
      type: exponential
      params:
        mean: 150                       # Search: concise answers
