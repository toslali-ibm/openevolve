# Mixed Workload
# Balanced mix of batch/realtime, with/without prefix sharing
# Tests routing under diverse conditions
# Total: 1000 requests

version: "1"
seed: 42
category: language
aggregate_rate: 150.0
num_requests: 1000

clients:
  - id: "batch-with-prefix"
    tenant_id: "tenant-A"
    slo_class: "batch"
    rate_fraction: 0.35
    streaming: false
    arrival:
      process: gamma
      cv: 3.0
    input_distribution:
      type: pareto_lognormal
      params:
        alpha: 1.5
        xm: 50
        mu: 5.5
        sigma: 1.2
        mix_weight: 0.3
    output_distribution:
      type: exponential
      params:
        mean: 200
    prefix_group: "shared-system-prompt"
    network:
      rtt_ms: 2.0
      bandwidth_mbps: 1000

  - id: "batch-no-prefix"
    tenant_id: "tenant-B"
    slo_class: "batch"
    rate_fraction: 0.25
    streaming: false
    arrival:
      process: gamma
      cv: 2.5
    input_distribution:
      type: pareto_lognormal
      params:
        alpha: 1.5
        xm: 50
        mu: 5.0
        sigma: 1.0
        mix_weight: 0.3
    output_distribution:
      type: exponential
      params:
        mean: 180
    network:
      rtt_ms: 5.0
      bandwidth_mbps: 800

  - id: "realtime-chat"
    tenant_id: "tenant-C"
    slo_class: "realtime"
    rate_fraction: 0.25
    streaming: true
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 128
        std_dev: 50
        min: 10
        max: 512
    output_distribution:
      type: exponential
      params:
        mean: 80
    network:
      rtt_ms: 30.0
      bandwidth_mbps: 200

  - id: "interactive-api"
    tenant_id: "tenant-D"
    slo_class: "interactive"
    rate_fraction: 0.15
    streaming: false
    arrival:
      process: gamma
      cv: 1.5
    input_distribution:
      type: gaussian
      params:
        mean: 200
        std_dev: 60
        min: 50
        max: 600
    output_distribution:
      type: exponential
      params:
        mean: 100
    network:
      rtt_ms: 10.0
      bandwidth_mbps: 500
