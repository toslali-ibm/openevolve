# Context Growth Stress Test
# Multi-turn conversations that build KV pressure over time
# Up to 8 rounds with context accumulation
# Total: 3000 requests

version: "1"
seed: 42
category: reasoning
aggregate_rate: 150.0
num_requests: 3000

clients:
  # Long coding sessions with growing context
  - id: "long-coding-session"
    tenant_id: "developers"
    slo_class: "interactive"
    rate_fraction: 0.40
    streaming: true
    arrival:
      process: gamma
      cv: 2.0
    input_distribution:
      type: gaussian
      params:
        mean: 200
        std_dev: 100
        min: 50
        max: 1000
    output_distribution:
      type: exponential
      params:
        mean: 300
    prefix_group: "coding-assistant"
    reasoning:
      multi_turn:
        max_rounds: 8
        think_time_us: 300000
        context_growth: "accumulate"

  # Document Q&A with context accumulation
  - id: "document-qa"
    tenant_id: "analysts"
    slo_class: "interactive"
    rate_fraction: 0.30
    streaming: false
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 500
        std_dev: 200
        min: 100
        max: 2000
    output_distribution:
      type: exponential
      params:
        mean: 200
    prefix_group: "doc-qa-system"
    reasoning:
      multi_turn:
        max_rounds: 5
        think_time_us: 500000
        context_growth: "accumulate"

  # Short burst requests (no multi-turn)
  - id: "quick-queries"
    tenant_id: "api-users"
    slo_class: "realtime"
    rate_fraction: 0.30
    streaming: false
    arrival:
      process: gamma
      cv: 4.0
    input_distribution:
      type: gaussian
      params:
        mean: 80
        std_dev: 30
        min: 10
        max: 200
    output_distribution:
      type: exponential
      params:
        mean: 40
    prefix_group: "api-system"
