# Burst + Steady State Mix
# Bursty batch jobs competing with steady realtime traffic
# CV=5.0 creates severe bursts, realtime needs protection
# Total: 6000 requests

version: "1"
seed: 42
category: language
aggregate_rate: 250.0
num_requests: 6000

clients:
  # Steady realtime traffic (must maintain SLO)
  - id: "realtime-chat-1"
    slo_class: "realtime"
    rate_fraction: 0.15
    streaming: true
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 100
        std_dev: 40
        min: 20
        max: 300
    output_distribution:
      type: exponential
      params:
        mean: 60
    prefix_group: "chat-system"

  - id: "realtime-chat-2"
    slo_class: "realtime"
    rate_fraction: 0.15
    streaming: true
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 120
        std_dev: 50
        min: 20
        max: 350
    output_distribution:
      type: exponential
      params:
        mean: 80
    prefix_group: "chat-system"

  # Extremely bursty batch (storms)
  - id: "batch-storm-1"
    slo_class: "batch"
    rate_fraction: 0.25
    streaming: false
    arrival:
      process: gamma
      cv: 5.0
    input_distribution:
      type: pareto_lognormal
      params:
        alpha: 1.3
        xm: 200
        mu: 6.5
        sigma: 1.2
        mix_weight: 0.35
    output_distribution:
      type: exponential
      params:
        mean: 400
    prefix_group: "batch-system-1"

  - id: "batch-storm-2"
    slo_class: "batch"
    rate_fraction: 0.25
    streaming: false
    arrival:
      process: gamma
      cv: 5.0
    input_distribution:
      type: pareto_lognormal
      params:
        alpha: 1.3
        xm: 200
        mu: 6.5
        sigma: 1.2
        mix_weight: 0.35
    output_distribution:
      type: exponential
      params:
        mean: 400
    prefix_group: "batch-system-2"

  # Interactive API (moderate)
  - id: "api-interactive"
    slo_class: "interactive"
    rate_fraction: 0.20
    streaming: false
    arrival:
      process: gamma
      cv: 2.0
    input_distribution:
      type: gaussian
      params:
        mean: 150
        std_dev: 60
        min: 30
        max: 500
    output_distribution:
      type: exponential
      params:
        mean: 120
    prefix_group: "api-system"
