# =============================================================================
# KV Pressure Workload
# =============================================================================
# GOAL: Stress KV cache management and memory-aware routing
#
# Design principle: Long sequences that consume significant KV blocks.
# - Large input prompts (1000+ tokens) eat KV cache quickly
# - Long outputs keep KV blocks allocated longer
# - FreeKVBlocks becomes a critical routing signal
#
# Current WeightedScoring weakness: Uses FreeKVBlocks but not KVUtilization.
# A smarter router could predict KV consumption from request size,
# avoid routing long requests to already-pressured instances.
#
# Expected behavior:
# - Naive routing: Some instances hit KV limits → preemption/rejection
# - Memory-aware routing: Balances KV usage → fewer failures, lower latency
# =============================================================================

version: "1"
seed: 42
category: language
aggregate_rate: 60.0            # 60 req/s (lower rate, but heavy requests)
horizon: 60000000               # 1 minute

clients:
  # -------------------------------------------------------------------------
  # Heavy Consumer 1: Long-form Generation (40%)
  # Very long contexts - major KV pressure
  # -------------------------------------------------------------------------
  - id: "longform-heavy"
    prefix_group: "longform-context"
    tenant_id: "longform"
    slo_class: "batch"
    rate_fraction: 0.40                    # 24 req/s of heavy requests
    streaming: false
    arrival:
      process: gamma
      cv: 2.0
    input_distribution:
      type: pareto_lognormal              # Heavy tail - some very long
      params:
        alpha: 1.0                         # Heavier tail than normal
        xm: 500                            # Base is already long
        mu: 7.0                            # High mean
        sigma: 1.2
        mix_weight: 0.5                    # 50% from heavy tail
    output_distribution:
      type: pareto_lognormal              # Long outputs too
      params:
        alpha: 1.2
        xm: 200
        mu: 6.0
        sigma: 1.0
        mix_weight: 0.4

  # -------------------------------------------------------------------------
  # Heavy Consumer 2: Document Processing (30%)
  # Long inputs, moderate outputs
  # -------------------------------------------------------------------------
  - id: "docproc-heavy"
    prefix_group: "docproc-context"
    tenant_id: "docproc"
    slo_class: "batch"
    rate_fraction: 0.30                    # 18 req/s
    streaming: false
    arrival:
      process: gamma
      cv: 2.5
    input_distribution:
      type: gaussian
      params:
        mean: 1200                         # Very long documents
        std_dev: 400
        min: 400
        max: 3000
    output_distribution:
      type: exponential
      params:
        mean: 300

  # -------------------------------------------------------------------------
  # Light Consumer: Quick Queries (30%)
  # Short requests - should route to pressured instances
  # -------------------------------------------------------------------------
  - id: "quick-light"
    prefix_group: "quick-context"
    tenant_id: "quick"
    slo_class: "interactive"
    rate_fraction: 0.30                    # 18 req/s
    streaming: true
    arrival:
      process: poisson                     # Steady
    input_distribution:
      type: gaussian
      params:
        mean: 100                          # Short prompts
        std_dev: 40
        min: 20
        max: 250
    output_distribution:
      type: exponential
      params:
        mean: 80                           # Short outputs
