# =============================================================================
# Prefix-Concentrated Workload
# =============================================================================
# GOAL: Reward prefix-aware routing (cache affinity)
#
# Design principle: Only 2 prefix groups with high traffic each.
# - If router routes same-prefix requests to same instance → high cache hits
# - If router spreads them across instances → cache misses, wasted prefill
#
# Current WeightedScoring weakness: Ignores prefix locality entirely.
# A smarter router could track prefix→instance affinity and improve latency
# by 20-40% through cache reuse.
#
# Expected behavior:
# - Naive load-balancing: ~50% cache hit rate (random distribution)
# - Prefix-aware routing: ~90%+ cache hit rate (affinity)
# =============================================================================

version: "1"
seed: 42
category: language
aggregate_rate: 80.0            # 80 req/s total (20 req/s per instance)
horizon: 60000000               # 1 minute

clients:
  # -------------------------------------------------------------------------
  # Prefix Group A: Code Generation (50% of traffic)
  # All requests share a large system prompt for code context
  # High cache reuse potential if routed to same instance
  # -------------------------------------------------------------------------
  - id: "codegen-a"
    prefix_group: "shared-code-context"    # CRITICAL: same prefix for all
    tenant_id: "codegen"
    slo_class: "interactive"
    rate_fraction: 0.50                    # 40 req/s - high volume, same prefix
    streaming: false
    arrival:
      process: poisson                     # Steady arrivals (not bursty)
    input_distribution:
      type: gaussian
      params:
        mean: 300                          # Moderate prompts after prefix
        std_dev: 100
        min: 50
        max: 800
    output_distribution:
      type: exponential
      params:
        mean: 200

  # -------------------------------------------------------------------------
  # Prefix Group B: Document Analysis (50% of traffic)
  # All requests share a large system prompt for document processing
  # High cache reuse potential if routed to same instance
  # -------------------------------------------------------------------------
  - id: "docanalysis-b"
    prefix_group: "shared-doc-context"     # CRITICAL: different prefix group
    tenant_id: "docanalysis"
    slo_class: "interactive"
    rate_fraction: 0.50                    # 40 req/s - high volume, same prefix
    streaming: false
    arrival:
      process: poisson                     # Steady arrivals
    input_distribution:
      type: gaussian
      params:
        mean: 400                          # Longer doc analysis prompts
        std_dev: 150
        min: 100
        max: 1000
    output_distribution:
      type: exponential
      params:
        mean: 250
