# Prefix Cache Pressure Test
# 8 prefix groups vs 4 instances - forces routing tradeoffs
# Router must choose between load balancing and cache affinity
# Total: 8000 requests

version: "1"
seed: 42
category: language
aggregate_rate: 400.0
num_requests: 8000

clients:
  - id: "prefix-group-1"
    slo_class: "interactive"
    rate_fraction: 0.125
    streaming: false
    arrival:
      process: gamma
      cv: 2.5
    input_distribution:
      type: gaussian
      params:
        mean: 400
        std_dev: 100
        min: 100
        max: 1000
    output_distribution:
      type: exponential
      params:
        mean: 150
    prefix_group: "system-prompt-1"

