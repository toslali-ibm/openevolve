# V2 Workload: Cache Warmup & Exploitation
# PURPOSE: Test whether router exploits cached prefixes AFTER caches warm up.
# WHY ROUTING MATTERS: Early requests build cache on specific instances.
#   Later requests with matching prefixes should route to those instances.
#   Static 1:1 weights can't adapt to cache state; dynamic routing should
#   strongly favor prefix-affinity once caches are warm.
#
# DESIGN:
#   - 5000 requests at rate=1000 → 5 seconds simulated time
#   - 3 distinct prefix groups (each ~30% of traffic) create cache differentiation
#   - 15% no-prefix traffic tests load balancing without cache benefit
#   - Moderate rate creates queueing but doesn't saturate
#   - Long enough for caches to warm (~1250 reqs/instance before halfway point)

version: "1"
seed: 42
category: language
aggregate_rate: 1000.0
num_requests: 5000

clients:
  # Group A: Shared system prompt (e.g., chatbot)
  - id: "prefix-group-a"
    slo_class: "interactive"
    rate_fraction: 0.30
    streaming: false
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 300
        std_dev: 80
        min: 100
        max: 600
    output_distribution:
      type: exponential
      params:
        mean: 64
    prefix_group: "system-prompt-chatbot"
    prefix_length: 512

  # Group B: Different system prompt (e.g., code assistant)
  - id: "prefix-group-b"
    slo_class: "interactive"
    rate_fraction: 0.30
    streaming: false
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 400
        std_dev: 100
        min: 150
        max: 800
    output_distribution:
      type: exponential
      params:
        mean: 80
    prefix_group: "system-prompt-code"
    prefix_length: 384

  # Group C: Short shared prefix (e.g., API gateway)
  - id: "prefix-group-c"
    slo_class: "realtime"
    rate_fraction: 0.25
    streaming: true
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 100
        std_dev: 30
        min: 40
        max: 250
    output_distribution:
      type: exponential
      params:
        mean: 40
    prefix_group: "api-gateway-prompt"
    prefix_length: 128

  # No-prefix traffic: pure load balancing test
  - id: "unique-requests"
    slo_class: "batch"
    rate_fraction: 0.15
    streaming: false
    arrival:
      process: gamma
      cv: 3.0
    input_distribution:
      type: gaussian
      params:
        mean: 600
        std_dev: 200
        min: 200
        max: 1200
    output_distribution:
      type: exponential
      params:
        mean: 150
