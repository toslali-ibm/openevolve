# High Load Workload
# Stresses the system with high request rate
# Total: 1000 requests at 100 req/s

version: "1"
seed: 42
category: language
aggregate_rate: 300.0
num_requests: 1000

clients:
  - id: "high-volume-batch"
    tenant_id: "tenant-A"
    slo_class: "batch"
    rate_fraction: 0.7
    streaming: false
    arrival:
      process: gamma
      cv: 3.5                   # Bursty arrivals stress queuing
    input_distribution:
      type: pareto_lognormal
      params:
        alpha: 1.5
        xm: 50
        mu: 5.5
        sigma: 1.2
        mix_weight: 0.3
    output_distribution:
      type: exponential
      params:
        mean: 256
    network:
      rtt_ms: 2.0
      bandwidth_mbps: 1000

  - id: "realtime-traffic"
    tenant_id: "tenant-B"
    slo_class: "realtime"
    rate_fraction: 0.3
    streaming: true
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 128
        std_dev: 50
        min: 10
        max: 512
    output_distribution:
      type: exponential
      params:
        mean: 64
    network:
      rtt_ms: 20.0
      bandwidth_mbps: 500
