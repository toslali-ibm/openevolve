# H3: Signal Freshness Test
# Hypothesis: queue-depth distributes 200x better than kv-utilization at high rates
# Key finding: At >500 req/s, kv-utilization becomes stale; queue-depth is synchronous
# Reference: hypotheses/h3-signal-freshness/run.sh (rate=5000)
#
# This workload creates high request rates where signal freshness matters.
# A good router should prefer queue-depth over kv-utilization at high load.

version: "1"
seed: 42
category: language
aggregate_rate: 5000.0  # High rate to trigger signal staleness (H3)
num_requests: 1000      # Same as H3 experiment

clients:
  # Primary high-rate traffic (tests signal freshness)
  - id: "high-rate-primary"
    slo_class: "interactive"
    rate_fraction: 0.50
    streaming: false
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 200
        std_dev: 50
        min: 50
        max: 500
    output_distribution:
      type: exponential
      params:
        mean: 100
    prefix_group: "shared-system-prompt"
    prefix_length: 64  # Moderate prefix for cache interaction

  # Secondary burst traffic (amplifies signal staleness)
  - id: "burst-traffic"
    slo_class: "batch"
    rate_fraction: 0.30
    streaming: false
    arrival:
      process: gamma
      cv: 4.0  # High burstiness to stress signal freshness
    input_distribution:
      type: gaussian
      params:
        mean: 300
        std_dev: 100
        min: 100
        max: 800
    output_distribution:
      type: exponential
      params:
        mean: 200
    prefix_group: "batch-system"
    prefix_length: 128

  # Low-latency realtime (must maintain SLO despite high load)
  - id: "realtime-slo"
    slo_class: "realtime"
    rate_fraction: 0.20
    streaming: true
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 80
        std_dev: 20
        min: 20
        max: 200
    output_distribution:
      type: exponential
      params:
        mean: 40
    prefix_group: "realtime-prompt"
    prefix_length: 32
