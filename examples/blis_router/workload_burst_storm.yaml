# =============================================================================
# Burst Storm Workload
# =============================================================================
# GOAL: Stress-test load balancing responsiveness
#
# Design principle: Extreme burstiness creates transient load imbalances.
# - Very high CV (5-6) means requests arrive in tight clusters
# - Quick routing decisions matter - wrong choice = HOL blocking
# - Multiple clients with different burst patterns create chaos
#
# Current WeightedScoring weakness: May not react fast enough to bursts.
# A smarter router could use more aggressive load signals or predictive
# logic to avoid piling onto already-stressed instances.
#
# Expected behavior:
# - Slow/naive routing: Load piles up on some instances → high tail latency
# - Fast/smart routing: Spreads bursts evenly → lower P99
# =============================================================================

version: "1"
seed: 42
category: language
aggregate_rate: 150.0           # 150 req/s total (high load)
horizon: 60000000               # 1 minute

clients:
  # -------------------------------------------------------------------------
  # Burst Source 1: Webhook Handler (35%)
  # Extremely bursty - webhooks arrive in clusters
  # -------------------------------------------------------------------------
  - id: "webhook-burst"
    prefix_group: "webhook-handler"
    tenant_id: "webhooks"
    slo_class: "interactive"
    rate_fraction: 0.35                    # 52.5 req/s average
    streaming: false
    arrival:
      process: gamma
      cv: 6.0                              # EXTREME burstiness
    input_distribution:
      type: gaussian
      params:
        mean: 150
        std_dev: 50
        min: 30
        max: 400
    output_distribution:
      type: exponential
      params:
        mean: 120

  # -------------------------------------------------------------------------
  # Burst Source 2: Cron Job Pipeline (30%)
  # Very bursty - batch jobs trigger periodically
  # -------------------------------------------------------------------------
  - id: "cron-burst"
    prefix_group: "cron-pipeline"
    tenant_id: "cron"
    slo_class: "batch"
    rate_fraction: 0.30                    # 45 req/s average
    streaming: false
    arrival:
      process: gamma
      cv: 5.0                              # Very bursty
    input_distribution:
      type: pareto_lognormal
      params:
        alpha: 1.5
        xm: 80
        mu: 5.5
        sigma: 1.0
        mix_weight: 0.3
    output_distribution:
      type: exponential
      params:
        mean: 200

  # -------------------------------------------------------------------------
  # Burst Source 3: API Gateway (25%)
  # Moderately bursty - API traffic with some patterns
  # -------------------------------------------------------------------------
  - id: "api-burst"
    prefix_group: "api-gateway"
    tenant_id: "api"
    slo_class: "interactive"
    rate_fraction: 0.25                    # 37.5 req/s average
    streaming: false
    arrival:
      process: gamma
      cv: 4.0                              # Bursty
    input_distribution:
      type: gaussian
      params:
        mean: 200
        std_dev: 80
        min: 40
        max: 600
    output_distribution:
      type: exponential
      params:
        mean: 150

  # -------------------------------------------------------------------------
  # Steady Source: Background Processing (10%)
  # Low burstiness - provides baseline load
  # -------------------------------------------------------------------------
  - id: "background-steady"
    prefix_group: "background-tasks"
    tenant_id: "background"
    slo_class: "batch"
    rate_fraction: 0.10                    # 15 req/s
    streaming: false
    arrival:
      process: poisson                     # Steady (CV=1)
    input_distribution:
      type: gaussian
      params:
        mean: 100
        std_dev: 40
        min: 20
        max: 300
    output_distribution:
      type: exponential
      params:
        mean: 100
