# Prefix-Affinity: Multi-Turn Chat with Context Accumulation
# Hypothesis: Prefix-aware routing outperforms load-only for prefix-heavy workloads
# Key finding: 2.45x better TTFT; queue-depth destroys cache locality (23% vs 56% hit rate)
# Reference: hypotheses/prefix-affinity/run.sh (rate=5000, 2000 requests, max_rounds=5)
#
# This workload creates multi-turn conversations where routing to cached instances
# dramatically improves performance. Queue-depth routing actively destroys this benefit.

version: "1"
seed: 42
category: reasoning
aggregate_rate: 5000.0  # High rate as in prefix-affinity high-load test
num_requests: 2000      # Same as prefix-affinity Exp 2

clients:
  # Primary multi-turn chat (tests prefix affinity benefit)
  - id: "multi-turn-chat"
    tenant_id: "chat-users"
    slo_class: "interactive"
    rate_fraction: 0.50
    streaming: true
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 128
        std_dev: 30
        min: 32
        max: 512
    output_distribution:
      type: gaussian
      params:
        mean: 64
        std_dev: 20
        min: 16
        max: 256
    prefix_group: "chat-system-prompt"
    prefix_length: 256  # Shared system prompt
    reasoning:
      multi_turn:
        max_rounds: 5           # Same as prefix-affinity experiment
        think_time_us: 500000   # 500ms between turns
        context_growth: accumulate  # Context grows each turn

  # Secondary multi-turn (different prefix group)
  - id: "coding-assistant"
    tenant_id: "developers"
    slo_class: "interactive"
    rate_fraction: 0.30
    streaming: true
    arrival:
      process: gamma
      cv: 2.0
    input_distribution:
      type: gaussian
      params:
        mean: 200
        std_dev: 80
        min: 50
        max: 800
    output_distribution:
      type: exponential
      params:
        mean: 150
    prefix_group: "coding-system-prompt"
    prefix_length: 384
    reasoning:
      multi_turn:
        max_rounds: 4
        think_time_us: 300000
        context_growth: accumulate

  # Single-turn API traffic (no multi-turn, tests load balancing)
  - id: "api-requests"
    tenant_id: "api-users"
    slo_class: "realtime"
    rate_fraction: 0.20
    streaming: false
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 80
        std_dev: 20
        min: 20
        max: 200
    output_distribution:
      type: exponential
      params:
        mean: 40
    prefix_group: "api-system"
    prefix_length: 64
