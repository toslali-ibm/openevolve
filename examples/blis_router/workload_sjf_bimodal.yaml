# H1-SJF: Bimodal Workload for Scheduling-Aware Routing
# Hypothesis: SJF reduces TTFT for short requests in bimodal workloads
# Key finding: 94% TTFT reduction for 32-token vs 1024-token requests
# Reference: hypotheses/h1-sjf-scheduling/run.sh (rate=3000, constant distributions)
#
# This workload uses CONSTANT distributions to create clean bimodal separation.
# A scheduling-aware router should recognize short vs long requests and route
# short requests to less-loaded instances or instances with shorter queues.
#
# NOTE: Constant distributions are critical - Gaussian would blur the separation.
# Output tokens kept small so TTFT improvements show up in E2E.

version: "1"
seed: 42
category: language
aggregate_rate: 3000.0  # Same as H1 experiment
num_requests: 1000      # Same as H1 experiment

clients:
  # Short requests (interactive) - should benefit from smart routing
  - id: "short-jobs"
    slo_class: "interactive"
    rate_fraction: 0.50
    streaming: false
    arrival:
      process: poisson
    input_distribution:
      type: constant
      params:
        value: 32           # Exactly 32 tokens - SHORT
    output_distribution:
      type: constant
      params:
        value: 64           # Small output

  # Long requests (batch) - will dominate queue time under FCFS
  - id: "long-jobs"
    slo_class: "batch"
    rate_fraction: 0.50
    streaming: false
    arrival:
      process: poisson
    input_distribution:
      type: constant
      params:
        value: 1024         # Exactly 1024 tokens - 32x LONGER
    output_distribution:
      type: constant
      params:
        value: 128          # Moderate output
