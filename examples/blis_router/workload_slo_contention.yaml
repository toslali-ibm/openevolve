# =============================================================================
# SLO Contention Workload
# =============================================================================
# GOAL: Reward SLO-aware routing
#
# Design principle: Mix realtime (latency-critical) and batch (throughput) traffic.
# - Realtime requests need low queue depth to meet latency SLOs
# - Batch requests are tolerant but consume resources
#
# Current WeightedScoring weakness: Treats all requests equally.
# A smarter router could route realtime to less-loaded instances and
# batch to busier ones, improving realtime P99 significantly.
#
# Expected behavior:
# - Naive routing: Realtime requests get stuck behind batch → high P99
# - SLO-aware routing: Realtime avoids batch-heavy instances → low P99
# =============================================================================

version: "1"
seed: 42
category: language
aggregate_rate: 120.0           # 120 req/s total (moderate-high load)
horizon: 60000000               # 1 minute

clients:
  # =========================================================================
  # BATCH TRAFFIC (70%) - Latency tolerant, long-running
  # =========================================================================

  # -------------------------------------------------------------------------
  # Batch Pipeline 1: Summarization (40% of total)
  # Long inputs, long outputs - hogs resources
  # -------------------------------------------------------------------------
  - id: "batch-summarize"
    prefix_group: "batch-summarize-prompt"
    tenant_id: "batch-pipeline"
    slo_class: "batch"
    rate_fraction: 0.40                    # 48 req/s
    streaming: false
    arrival:
      process: gamma
      cv: 3.0                              # Bursty batch submissions
    input_distribution:
      type: pareto_lognormal              # Long documents
      params:
        alpha: 1.2
        xm: 200
        mu: 6.5
        sigma: 1.0
        mix_weight: 0.4
    output_distribution:
      type: exponential
      params:
        mean: 400                          # Long summaries

  # -------------------------------------------------------------------------
  # Batch Pipeline 2: Classification (30% of total)
  # Moderate inputs, short outputs
  # -------------------------------------------------------------------------
  - id: "batch-classify"
    prefix_group: "batch-classify-prompt"
    tenant_id: "batch-pipeline"
    slo_class: "batch"
    rate_fraction: 0.30                    # 36 req/s
    streaming: false
    arrival:
      process: gamma
      cv: 2.5
    input_distribution:
      type: gaussian
      params:
        mean: 300
        std_dev: 100
        min: 50
        max: 800
    output_distribution:
      type: gaussian
      params:
        mean: 50                           # Short classification output
        std_dev: 20
        min: 10
        max: 150

  # =========================================================================
  # REALTIME TRAFFIC (30%) - Latency critical, short requests
  # =========================================================================

  # -------------------------------------------------------------------------
  # Realtime: Live Chat (20% of total)
  # Short inputs, short outputs - needs fast response
  # -------------------------------------------------------------------------
  - id: "realtime-chat"
    prefix_group: "realtime-chat-prompt"
    tenant_id: "live-chat"
    slo_class: "realtime"
    rate_fraction: 0.20                    # 24 req/s
    streaming: true                        # Streaming for fast TTFT
    arrival:
      process: poisson                     # Steady user-driven traffic
    input_distribution:
      type: gaussian
      params:
        mean: 80                           # Short chat messages
        std_dev: 30
        min: 10
        max: 200
    output_distribution:
      type: exponential
      params:
        mean: 100                          # Quick responses

  # -------------------------------------------------------------------------
  # Realtime: Search/Autocomplete (10% of total)
  # Very short, needs sub-100ms response
  # -------------------------------------------------------------------------
  - id: "realtime-search"
    prefix_group: "realtime-search-prompt"
    tenant_id: "search"
    slo_class: "realtime"
    rate_fraction: 0.10                    # 12 req/s
    streaming: true
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 50                           # Very short queries
        std_dev: 20
        min: 10
        max: 150
    output_distribution:
      type: gaussian
      params:
        mean: 30                           # Very short responses
        std_dev: 10
        min: 5
        max: 80
