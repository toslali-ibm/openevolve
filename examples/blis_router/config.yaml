# ============================================================================
# OpenEvolve Configuration: BLIS Router Weight Optimization
# ============================================================================
#
# EXPERIMENT: Evolve adaptive routing weights for BLIS multi-instance cluster
# GOAL: Minimize average end-to-end latency across workload patterns
# BASELINE: Static weights (cache=0.6, load=0.4)
# TARGET: 5-10% latency reduction through adaptive weight calculation
#
# ============================================================================

# ----------------------------------------------------------------------------
# Execution Settings
# ----------------------------------------------------------------------------

# Total number of evolution iterations to run
# 50 iterations = ~1-2 hours depending on BLIS simulation time
# Each iteration: sample programs → LLM generates mutation → evaluate → update database
max_iterations: 50

# Save checkpoint every N iterations for resumability
# Checkpoints include full database state, best program, and evolution progress
checkpoint_interval: 5

# Logging verbosity: DEBUG, INFO, WARNING, ERROR
# INFO provides good balance between detail and readability
log_level: "INFO"

# ----------------------------------------------------------------------------
# LLM Configuration
# ----------------------------------------------------------------------------

llm:
  # Primary model for generating code mutations
  # aws/claude-sonnet-4-5: High quality, good for code generation
  # Alternative options: "GCP/claude-opus-4", "gcp/gemini-2.5-pro", "GCP/gemini-2.5-flash"
  primary_model: Azure/gpt-4o

  # Weight for primary model in ensemble (1.0 = use only primary)
  # If using ensemble, this + secondary_model_weight should sum to 1.0
  primary_model_weight: 0.6

  # Optional: Secondary model for ensemble diversity
  # Uncomment to enable two-model ensemble voting
  secondary_model: GCP/gemini-2.5-flash
  secondary_model_weight: 0.4

  # Optional: API base URL for custom endpoints
  # Uncomment if using custom LLM API endpoint
  api_base: https://ete-litellm.ai-models.vpc-int.res.ibm.com

  # Temperature controls randomness in LLM generation
  # 0.7 = balanced creativity and consistency
  # Lower (0.3-0.5) = more conservative, similar to past solutions
  # Higher (0.8-1.0) = more creative, diverse mutations
  temperature: 1

  # Optional: Top-p (nucleus sampling) for generation diversity
  # NOTE: AWS Bedrock (Claude) doesn't allow both temperature and top_p
  # Set to null explicitly to avoid API error - using temperature only
#   top_p: null

  # Maximum tokens in LLM response
  # 16000 sufficient for routing.go file (~12KB source)
  # Increase if evolving larger files
  max_tokens: 16000

  # Timeout for LLM API calls (seconds)
  # 120s = 2 minutes, sufficient for most models
  # Increase if using slower models or seeing timeout errors
  timeout: 120

# ----------------------------------------------------------------------------
# Prompt Configuration
# ----------------------------------------------------------------------------

prompt:
  # System message guides the LLM's optimization approach
  # This is the primary way to communicate goals, constraints, and strategies
  system_message: |
    You are an expert Go programmer and distributed systems optimization specialist.

    # TARGET: Optimize BLIS Router for Multi-Instance LLM Inference Cluster
    # GOAL: Minimize average end-to-end latency across diverse workload patterns
    # HARDWARE: Multi-replica cluster with KV cache and request queues
    # BASELINE: Static weighted routing (cache=0.6, load=0.4)
    # TARGET: 5-10% latency reduction through adaptive weight calculation

    # CURRENT ROUTING ALGORITHM:
    ```go
    func (ws *WeightedScoring) Route(req *Request, state *RouterState) RoutingDecision {
        // For each instance, compute:
        cacheScore := (1.0 - snap.KVUtilization) * ws.cacheWeight
        loadScore := (1.0 - normalizedLoad) * ws.loadWeight
        score := cacheScore + loadScore

        // Route to instance with highest score
    }
    ```

    # AVAILABLE STATE (you can use these in your optimization):

    **Instance Snapshot (snap):**
    - `snap.KVUtilization` (float64, range [0.0-1.0])
        How full is this instance's KV cache?
        0.0 = completely empty (lots of room for new cached tokens)
        1.0 = completely full (will need to evict to cache new tokens)
        Lower values indicate better cache opportunity

    - `snap.QueueDepth` (int, ≥0)
        Number of requests waiting in queue
        Higher values indicate congestion

    - `snap.BatchSize` (int, ≥0)
        Number of requests currently being processed
        Higher values indicate busy instance

    - `snap.FreeKVBlocks` (int64, ≥0)
        Number of available cache blocks
        Higher values indicate more cache capacity

    - `snap.ID` (string)
        Instance identifier (for debugging/logging)

    **Computed Variables:**
    - `normalizedLoad` (float64, range [0.0-1.0])
        Relative load compared to other instances
        0.0 = least loaded (idle or light queue)
        1.0 = most loaded (longest queue + biggest batch)
        Computed as: (QueueDepth + BatchSize) / maxLoad

    **Global State:**
    - `state.Clock` (int64, microseconds)
        Current simulation time
        Can be used to detect temporal patterns, bursts, time-of-day effects

    - `state.Snapshots` ([]RoutingSnapshot)
        Array of all instance snapshots
        Can be used to compute cluster-wide statistics

    **Current Weights:**
    - `ws.cacheWeight` (float64, currently 0.6)
        How much to prioritize cache affinity

    - `ws.loadWeight` (float64, currently 0.4)
        How much to prioritize load balancing

    # OPTIMIZATION OPPORTUNITIES IN THE EVOLVE-BLOCK:

    **1. Cache-Adaptive Weighting:**
    ```go
    // CURRENT: Static weights regardless of cache state
    // OPTIMIZE: Adjust weights based on cache utilization

    // Example: When cache has room, prioritize affinity
    if snap.KVUtilization < 0.3 {
        cacheWeight = 0.8  // More cache affinity
        loadWeight = 0.2   // Less load balancing
    } else if snap.KVUtilization > 0.7 {
        cacheWeight = 0.3  // Less cache affinity (cache full anyway)
        loadWeight = 0.7   // More load balancing
    }
    ```

    **2. Load-Adaptive Weighting:**
    ```go
    // CURRENT: Static weights regardless of load
    // OPTIMIZE: Adjust weights based on system load

    // Example: Under heavy load, balance aggressively
    if normalizedLoad > 0.7 {
        cacheWeight = 0.3  // Less cache priority
        loadWeight = 0.7   // More load balancing
    } else if normalizedLoad < 0.3 {
        cacheWeight = 0.7  // Can afford cache optimization
        loadWeight = 0.3   // Less need to balance
    }
    ```

    **3. Congestion-Aware Adjustments:**
    ```go
    // OPTIMIZE: Consider absolute queue depth for congestion

    // Example: Penalize deeply queued instances
    if snap.QueueDepth > 50 {
        // Severely reduce score for overloaded instances
        // Or adjust weights dynamically
    }
    ```

    **4. Hybrid Scoring Strategies:**
    ```go
    // OPTIMIZE: Combine multiple factors intelligently

    // Example: Multi-threshold logic
    if snap.KVUtilization < 0.3 && normalizedLoad < 0.5 {
        // Best case: empty cache + light load
        cacheWeight = 0.9
        loadWeight = 0.1
    } else if snap.QueueDepth > 30 {
        // Avoid congested instances
        cacheWeight = 0.2
        loadWeight = 0.8
    }
    ```

    **5. Non-Linear Scoring:**
    ```go
    // OPTIMIZE: Use non-linear transformations

    // Example: Exponential penalties for high utilization
    cachePenalty := snap.KVUtilization * snap.KVUtilization
    cacheScore := (1.0 - cachePenalty) * cacheWeight
    ```

    **6. Temporal Pattern Detection:**
    ```go
    // OPTIMIZE: Detect burst periods using state.Clock

    // Example: Time-based strategy adjustment
    // (requires tracking state across calls - be careful!)
    ```

    # EVOLUTION CONSTRAINTS - CRITICAL RULES:

    **MUST NOT CHANGE:**
    ❌ Code outside EVOLVE-BLOCK-START and EVOLVE-BLOCK-END markers
    ❌ Function signatures or return types
    ❌ Variable declarations outside the block (snap, normalizedLoad, etc.)
    ❌ The final score assignment: `scores[snap.ID] = score`
    ❌ The best score selection logic below the block
    ❌ Overall algorithm correctness (must compute valid routing decision)

    **ALLOWED TO OPTIMIZE:**
    ✅ Weight calculation logic (cacheWeight, loadWeight values)
    ✅ Conditional logic based on available state
    ✅ Score computation formulas (cacheScore, loadScore)
    ✅ Variable declarations within the EVOLVE-BLOCK
    ✅ Mathematical operations and transformations
    ✅ Multi-threshold logic and state-based adaptation
    ✅ Use of any available state variables (snap.*, normalizedLoad, state.*)

    **GO SYNTAX REQUIREMENTS:**
    - Use proper Go syntax (use `:=` for new variables, `=` for existing)
    - Maintain type consistency (float64 for weights and scores)
    - Avoid division by zero (check denominators)
    - Keep array/slice access in bounds
    - Use valid Go operators and functions

    # SPECIFIC OPTIMIZATION STRATEGIES TO TRY:

    **Strategy 1: Cache Utilization Thresholds**
    ```go
    // Adapt weights based on cache fullness levels
    // Low cache usage → prioritize cache affinity
    // High cache usage → prioritize load balancing
    ```

    **Strategy 2: Load-Based Adaptation**
    ```go
    // Adjust strategy based on system load
    // Light load → optimize for cache hits
    // Heavy load → optimize for balance
    ```

    **Strategy 3: Multi-Factor Decision Trees**
    ```go
    // Combine cache + load + queue depth
    // Use nested conditionals to handle different scenarios
    // E.g., "if cache low AND load low, then ..."
    ```

    **Strategy 4: Non-Linear Scoring**
    ```go
    // Apply exponential/logarithmic transformations
    // Penalize extreme values more heavily
    // Reward optimal ranges more
    ```

    **Strategy 5: Hybrid Approaches**
    ```go
    // Combine adaptive weights with score adjustments
    // Use both weight tuning and score post-processing
    ```

    # SUCCESS CRITERIA:

    - **Compilation**: Go code must compile without syntax errors
    - **Correctness**: Must produce valid routing decisions for all instances
    - **Performance**: Target 5-10% reduction in average end-to-end latency
    - **Consistency**: Should improve across all workload types (light, heavy, mixed)
    - **Stability**: No panics, division by zero, or NaN values

    # EVALUATION:

    Your evolved code will be tested on 3 workload patterns:
    1. **Light load**: 10 req/s, 100 requests
    2. **Heavy load**: 50 req/s, 500 requests
    3. **Mixed load**: 20 req/s, 300 requests

    **Scoring Formula:**
    ```
    avg_latency = mean([light_e2e, heavy_e2e, mixed_e2e])
    score = -avg_latency

    Lower latency = Higher score (less negative) = Better!
    ```

    # IMPORTANT NOTES:

    - Focus ONLY on optimizing code between EVOLVE-BLOCK-START and EVOLVE-BLOCK-END
    - The rest of the file provides context but should not be modified
    - Your changes must be valid Go code that compiles successfully
    - Think about different workload scenarios: light, heavy, bursty traffic
    - The router runs on every request, so keep logic fast and simple
    - Avoid overfitting to specific workloads - aim for general improvements

    Your goal is to discover adaptive weighting strategies that outperform
    the static baseline across diverse workload patterns.

  # Number of top-performing programs to show as examples to the LLM
  # 3 = show 3 best programs from database for inspiration
  # Higher values = more examples but longer prompts
  num_top_programs: 3

  # Number of diverse programs to show for exploration
  # 2 = show 2 diverse programs to encourage variation
  # Helps prevent premature convergence to local optima
  num_diverse_programs: 2

# ----------------------------------------------------------------------------
# Database Configuration (MAP-Elites)
# ----------------------------------------------------------------------------

database:
  # Path where evolution database is stored
  # Contains program archive, scores, features, and evolution history
#   db_path: "./examples/blis_router/openevolve_output/blis_router_evolution"

  # Total number of programs to maintain in population across all islands
  # 50 = good balance between diversity and efficiency
  # Larger = more diversity but slower evolution
  population_size: 50

  # Size of elite archive (best programs regardless of features)
  # 15 = keep top 15 programs for guaranteed exploitation
  # These are always available for sampling
  archive_size: 15

  # Number of islands for island-based evolution
  # 3 islands = good diversity without too much overhead
  # Each island evolves independently, with periodic migration
  # Prevents premature convergence, explores different strategies
  num_islands: 3

  # Ratio of programs selected from elite (top performers)
  # 0.3 = 30% of samples come from top 30% of population
  # Higher = more exploitation of known good solutions
  # Lower = more exploration of average solutions
  elite_selection_ratio: 0.3

  # Balance between exploitation (best programs) and exploration (diverse programs)
  # exploitation_ratio: 0.65 = 65% of samples from best programs
  # exploration_ratio: 0.35 = 35% of samples from diverse programs
  # Should sum to 1.0
  exploitation_ratio: 0.65
  exploration_ratio: 0.35

# ----------------------------------------------------------------------------
# Evaluator Configuration
# ----------------------------------------------------------------------------

evaluator:
  # Timeout for each program evaluation (seconds)
  # 300s = 5 minutes per evaluation
  # Includes: writing file, Go build, running 3 BLIS workloads, parsing
  # Increase if BLIS simulations are slow or workloads are large
  timeout: 30

  # Number of programs to evaluate in parallel
  # 1 = sequential evaluation (required for BLIS since Go build is sequential)
  # BLIS writes to same routing.go file, so can't parallelize safely
  parallel_evaluations: 1

  # Disable cascade evaluation (not implemented for BLIS)
  # BLIS uses direct evaluation: write file → build → run → score
  cascade_evaluation: false

# ----------------------------------------------------------------------------
# Evolution Strategy Settings
# ----------------------------------------------------------------------------

# Use diff-based mutations (show only changes to LLM)
# true = LLM sees "old code → new code" diffs (more efficient)
# false = LLM sees full programs (more context but larger prompts)
# Recommended: true for code evolution
diff_based_evolution: true

# Allow LLM to rewrite entire programs (not just EVOLVE-BLOCK)
# false = LLM can only modify EVOLVE-BLOCK section (enforced)
# true = LLM can modify entire file (risky, may break structure)
# Recommended: false for safety
allow_full_rewrites: false

# Maximum allowed code length (characters)
# 20000 = sufficient for routing.go with comments (~12KB base + mutations)
# Safety limit to prevent runaway code generation
max_code_length: 20000
