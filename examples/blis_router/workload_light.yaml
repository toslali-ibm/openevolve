# =============================================================================
# Light Interactive Workload
# =============================================================================
# This workload simulates a low-traffic interactive scenario with:
# - Low request rate (10 req/s) representing light system usage
# - Moderate burstiness (cv=2.0) typical of human-driven interactions
# - Interactive SLO class: requires low latency for good user experience
# - Shorter average outputs (200 tokens) typical of conversational responses
# Total: ~1200 requests over 2 minutes
# =============================================================================

version: "1"                    # Config format version
seed: 42                        # Random seed for reproducibility
category: language              # Workload category (language model inference)
aggregate_rate: 10.0            # Total request rate: 10 requests per second
horizon: 120000000              # Simulation duration: 2 minutes (in microseconds)

clients:
  - id: "light-traffic"         # Unique client identifier
    slo_class: "interactive"    # SLO class: interactive (requires low latency)
    rate_fraction: 1.0          # This client generates 100% of the traffic
    streaming: false            # Non-streaming: wait for full response
    arrival:
      process: gamma            # Gamma arrival process (generalizes Poisson)
      cv: 2.0                   # Coefficient of variation: moderately bursty
    input_distribution:         # Distribution for input token counts (prompt length)
      type: pareto_lognormal    # Heavy-tailed: mix of Pareto and lognormal
      params:
        alpha: 1.5              # Pareto shape: controls tail heaviness
        xm: 50                  # Pareto scale: minimum value
        mu: 5.5                 # Lognormal mean (log scale): ~245 tokens median
        sigma: 1.2              # Lognormal std dev: high variance in prompt lengths
        mix_weight: 0.3         # 30% Pareto, 70% lognormal
    output_distribution:        # Distribution for output token counts (response length)
      type: exponential         # Exponential: memoryless, typical for completions
      params:
        mean: 200               # Average output: 200 tokens per response
