# =============================================================================
# Light Interactive Workload (Multi-Tenant)
# =============================================================================
# Simulates 3 different chatbot applications sharing the cluster:
# - Each tenant has its own system prompt prefix (prefix_group)
# - Requests within a tenant share the same prefix (cache opportunity)
# - Total: ~600 requests over 1 minute across 3 tenants
# =============================================================================

version: "1"
seed: 42
category: language
aggregate_rate: 10.0            # 10 req/s total across all tenants
horizon: 60000000              # 1 minutes

clients:
  # -------------------------------------------------------------------------
  # Tenant A: Customer Support Chatbot (40% of traffic)
  # All requests share a common system prompt for support context
  # -------------------------------------------------------------------------
  - id: "support-chatbot"
    prefix_group: "tenant-a-support"    # Shared prefix: support system prompt
    slo_class: "interactive"
    rate_fraction: 0.4                  # 4 req/s
    streaming: false
    arrival:
      process: gamma
      cv: 2.0                           # Moderately bursty (human-driven)
    input_distribution:
      type: gaussian
      params:
        mean: 150                       # Support queries: moderate length
        std_dev: 50
        min: 20
        max: 400
    output_distribution:
      type: exponential
      params:
        mean: 180                       # Support responses: moderate length

  # -------------------------------------------------------------------------
  # Tenant B: Code Assistant (35% of traffic)
  # All requests share a common system prompt for coding context
  # -------------------------------------------------------------------------
  - id: "code-assistant"
    prefix_group: "tenant-b-code"       # Shared prefix: coding system prompt
    slo_class: "interactive"
    rate_fraction: 0.35                 # 3.5 req/s
    streaming: false
    arrival:
      process: gamma
      cv: 2.5                           # More bursty (developers work in bursts)
    input_distribution:
      type: pareto_lognormal            # Code snippets: highly variable length
      params:
        alpha: 1.5
        xm: 50
        mu: 5.5
        sigma: 1.0
        mix_weight: 0.3
    output_distribution:
      type: exponential
      params:
        mean: 250                       # Code completions: longer outputs

  # -------------------------------------------------------------------------
  # Tenant C: General Assistant (25% of traffic)
  # All requests share a common system prompt for general chat
  # -------------------------------------------------------------------------
  - id: "general-assistant"
    prefix_group: "tenant-c-general"    # Shared prefix: general system prompt
    slo_class: "interactive"
    rate_fraction: 0.25                 # 2.5 req/s
    streaming: false
    arrival:
      process: poisson                  # Steady arrivals
    input_distribution:
      type: gaussian
      params:
        mean: 100                       # General queries: shorter
        std_dev: 40
        min: 10
        max: 300
    output_distribution:
      type: exponential
      params:
        mean: 150                       # General responses: moderate
