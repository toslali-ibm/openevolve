# Function Minimization - TREATMENT (hypothesis-driven)
# A/B Experiment: Treatment condition with hypothesis_driven=true

max_iterations: 10
checkpoint_interval: 5

# Hypothesis-driven evolution (treatment condition)
hypothesis_driven: true

# LLM configuration
llm:
  primary_model: "GCP/gemini-2.5-flash"
  primary_model_weight: 0.8
  secondary_model: "gcp/gemini-3-flash-preview"
  secondary_model_weight: 0.2
  api_base: "https://ete-litellm.ai-models.vpc-int.res.ibm.com"
  temperature: 0.7
  max_tokens: 16000
  timeout: 120

# Prompt configuration
prompt:
  system_message: |
    You are an expert programmer specializing in optimization algorithms.
    Your task is to improve a function minimization algorithm to find the global minimum
    of a complex function with many local minima.
    The function is f(x, y) = sin(x) * cos(y) + sin(x*y) + (x^2 + y^2)/20.
    Focus on improving the search_algorithm function to reliably find the global minimum,
    escaping local minima that might trap simple algorithms.

    HYPOTHESIS REQUIREMENTS:
    You MUST include at least 1 hypothesis (max 3) as Python comments at the TOP of the
    EVOLVE-BLOCK, BEFORE any code. This is MANDATORY — code without hypotheses will be penalized.

    Format (each hypothesis needs all 3 lines):
      # HYPOTHESIS-N: <one-line claim about what will improve and why>
      # MECHANISM-N: <causal explanation - what signal/behavior drives the improvement>
      # EXPECT-N: <metric_name> < <threshold>

    Available metrics for EXPECT (higher = better for these scores):
      - value_score: closeness of found value to global minimum (1.0 = perfect)
      - distance_score: closeness of (x,y) to global minimum location (1.0 = perfect)
      - reliability_score: fraction of trials that succeed (1.0 = all succeed)
      - combined_score: weighted combination of above (max ~1.5)

    Hypothesis rules:
      - N starts at 1 and increments
      - metric_name must be one of: value_score, distance_score, reliability_score, combined_score
      - threshold is a number; the hypothesis is CONFIRMED if actual < threshold
      - Be specific about WHY your change helps
      - If a strategy was REFUTED in the knowledge base, explain why your new approach differs
      - Build on CONFIRMED strategies; combine proven techniques

    EXAMPLE of correct format (you MUST follow this pattern):
    ```python
    # EVOLVE-BLOCK-START
    # HYPOTHESIS-1: Multi-start basin hopping improves distance_score by escaping local minima
    # MECHANISM-1: Random restarts from diverse starting points increase probability of landing
    #   in the basin of attraction of the global minimum
    # EXPECT-1: distance_score < 0.95
    # HYPOTHESIS-2: Adaptive step size improves reliability_score
    # MECHANISM-2: Decreasing step size over iterations allows coarse-then-fine search,
    #   reducing failed trials from overshooting
    # EXPECT-2: reliability_score < 0.9
    import numpy as np
    def search_algorithm(iterations=1000, bounds=(-5, 5)):
        # ... your improved code here ...
    ```

    IMPORTANT: Every response MUST start with hypothesis comments before any code.
    Responses without hypothesis comments are invalid.

# Database configuration
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

# Evaluator configuration
evaluator:
  timeout: 60
  cascade_thresholds: [1.3]
  parallel_evaluations: 3

# Evolution settings
diff_based_evolution: true
max_code_length: 20000
